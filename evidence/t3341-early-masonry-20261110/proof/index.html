<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#202933;color:#fff;font:16px sans-serif}#note{position:absolute;top:12px;left:16px;padding:10px;background:#111b}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/vendor/three-0.185.1/three.module.js","three/addons/":"/vendor/three-0.185.1/addons/"}}</script></head><body><div id="note">Development shader proof · T-3341<br>Brick and lime mortar (left) · exterior clay stack (right)</div><script type="module">
import * as THREE from 'three';
import {loadMasonrySurfaces} from '/js/masonry-surfaces.js';
import {packScalars} from '/js/compact-attributes.js';
import {initKTX2,ktx2State} from '/js/ktx2.js';
try {
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.setClearColor(0x27313b);document.body.append(renderer.domElement);
 renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;

 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x755333,2));const sun=new THREE.DirectionalLight(0xffffff,4);sun.position.set(-4,6,7);scene.add(sun);

 await renderer.compileAsync(scene,camera);renderer.render(scene,camera);
 window.PROOF={status:errors.length?'SHADER_FAIL':'READY',errors,maps:surfaces.sets,ktx2:ktx2State,renderer:renderer.info.render,query:location.search};
 if(errors.length)throw new Error(JSON.stringify(errors));

</script></body></html>
